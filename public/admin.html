<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin | ResolveDesk</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <b>ResolveDesk Admin</b>
  <a href="/">Client Portal</a>
</header>

<main>
  <section class="card">
    <h2>Admin Access</h2>
    <input id="token" type="password" autocomplete="current-password" placeholder="Admin token">
    <button type="button" onclick="loadCases()">Load Cases</button>
  </section>
  <section id="cases"></section>
</main>

<script>
let data = [];

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, (m) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[m]));
}

function headers() {
  return { "x-admin-token": document.querySelector("#token").value };
}

async function loadCases() {
  const r = await fetch("/api/cases", { headers: headers() });
  const body = await r.json().catch(() => ({ error: "Server error." }));

  if (!r.ok) {
    document.querySelector("#cases").innerHTML =
      `<section class="card"><div class="error">${esc(body.error)}</div></section>`;
    return;
  }

  data = body;
  render();
}

function render() {
  const statuses = [
    "Submitted", "Under Review", "Processing",
    "Completed", "Failed", "Cancelled"
  ];

  document.querySelector("#cases").innerHTML = data.length
    ? data.map((x) => `
      <section class="card">
        <h2>${esc(x.id)} — ${esc(x.name)}</h2>
        <p>${esc(x.email)} · ${esc(x.issue)}</p>
        <p>${esc(x.description)}</p>

        <details>
          <summary>Private payment details</summary>
          <p><b>Bank:</b> ${esc(x.bank_name)}</p>
          <p><b>Account name:</b> ${esc(x.account_name)}</p>
          <p><b>Account number:</b> ${esc(x.account_number)}</p>
          <p><b>Country:</b> ${esc(x.bank_country)}</p>
        </details>

        <label>Case status</label>
        <select id="s-${esc(x.id)}">
          ${statuses.map((s) =>
            `<option value="${esc(s)}" ${x.status === s ? "selected" : ""}>${esc(s)}</option>`
          ).join("")}
        </select>

        <textarea id="m-${esc(x.id)}" placeholder="Case update message">${esc(x.status_message)}</textarea>
        <button type="button" onclick="saveCase('${esc(x.id)}')">Save Case Update</button>
      </section>
    `).join("")
    : `<section class="card"><p>No cases found.</p></section>`;
}

async function saveCase(id) {
  const status = document.querySelector("#s-" + id).value;
  const message = document.querySelector("#m-" + id).value;

  const r = await fetch("/api/cases/" + encodeURIComponent(id) + "/status", {
    method: "PATCH",
    headers: {
      "Content-Type": "application/json",
      ...headers()
    },
    body: JSON.stringify({ status, message })
  });

  const body = await r.json().catch(() => ({}));
  alert(r.ok ? "Updated" : (body.error || "Update failed"));
  if (r.ok) loadCases();
}
</script>
</body>
</html>
